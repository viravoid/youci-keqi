name: Deploy to EdgeOne

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: NITRO_PRESET=edgeone-pages bun run build

      - name: Deploy
        run: |
          npx edgeone makers deploy .edgeone \
            -n "youci-keqi" \
            -a global \
            -t "${{ secrets.EDGEONE_API_TOKEN }}" \
            --json 2>&1 | tee /tmp/deploy-output.txt
          grep -oP 'EDGEONE_DEPLOY_URL=\Khttps://[^"]+' /tmp/deploy-output.txt | head -1 > /tmp/deploy-url.txt
          echo "DEPLOYED: $(cat /tmp/deploy-url.txt)"

      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.REDIRECT_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update redirect
        run: |
          git clone git@github.com:viravoid/youci-redirect.git /tmp/youci-redirect
          cp /tmp/deploy-url.txt /tmp/youci-redirect/url.txt
          cd /tmp/youci-redirect
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add url.txt
          git diff --staged --quiet || git commit -m "auto: refresh EdgeOne token"
          git push
